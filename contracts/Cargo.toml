[workspace]
resolver = "2"
members = [
    "cultural-entity-registry",
    "cultural-credential-registry",
]

[workspace.dependencies]
# Versiones fijadas. stellar-access 0.7.2 requiere soroban-sdk ^26.1.0.
# No usar rangos flotantes: reproducibilidad ante todo.
soroban-sdk = "=26.1.1"
stellar-access = "=0.7.2"

[workspace.lints.clippy]
# Las firmas de los entrypoints las dicta el contrato de dominio (ids, hashes,
# esquemas); el lint también dispara dentro de los macros de soroban-sdk.
too_many_arguments = "allow"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
