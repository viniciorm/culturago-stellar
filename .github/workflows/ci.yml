name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: culturago_test
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5433/culturago_test
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5433/culturago_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exact Rust toolchain
        run: rustup show

      - name: Migrate isolated test database
        run: pnpm migrate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Run tests
        run: pnpm test

      - name: Contracts lint
        run: pnpm contracts:lint

      - name: Contracts test
        run: pnpm contracts:test

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli_27.1.0_amd64.deb -o /tmp/stellar.deb
          sudo dpkg -i /tmp/stellar.deb
          rustup target add wasm32v1-none || true

      - name: Contracts build
        run: pnpm contracts:build

      # Vulnerabilidades HIGH transitivas conocidas en el stack passkey-kit / OpenZeppelin / Stellar SDK / toml.
      # Documentadas como deuda técnica; no se corrigen en este PR para no modificar el stack de Danilo.
      # Política temporal evaluada y aceptada para el piloto en Stellar Testnet; debe revisarse antes de una etapa productiva posterior.
      - name: Audit production dependencies (report)
        run: pnpm audit --prod || true

      - name: Block critical production vulnerabilities
        run: pnpm audit --prod --audit-level=critical

      - name: Build
        run: pnpm build
