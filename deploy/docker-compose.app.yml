services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_CULTURAGO_ENV: ${NEXT_PUBLIC_CULTURAGO_ENV:-testnet}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://culturago.cl}
        NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: ${NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
        NEXT_PUBLIC_STELLAR_RPC_URL: ${NEXT_PUBLIC_STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
        NEXT_PUBLIC_ENTITY_REGISTRY_CONTRACT_ID: ${NEXT_PUBLIC_ENTITY_REGISTRY_CONTRACT_ID}
        NEXT_PUBLIC_CREDENTIAL_REGISTRY_CONTRACT_ID: ${NEXT_PUBLIC_CREDENTIAL_REGISTRY_CONTRACT_ID}
        NEXT_PUBLIC_STELLAR_EXPLORER_BASE: ${NEXT_PUBLIC_STELLAR_EXPLORER_BASE:-https://stellar.expert/explorer/testnet}
        NEXT_PUBLIC_SMART_WALLET_WASM_HASH: ${NEXT_PUBLIC_SMART_WALLET_WASM_HASH}
        NEXT_PUBLIC_SMART_WALLET_ACCEPTED_WASM_HASHES: ${NEXT_PUBLIC_SMART_WALLET_ACCEPTED_WASM_HASHES}
    container_name: culturago-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    env_file:
      - /opt/culturago/.env
    environment:
      - NODE_ENV=production
      - PORT=3080
      - HOSTNAME=0.0.0.0
    networks:
      - culturago
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: culturago-postgres
    restart: unless-stopped
    env_file:
      - /opt/culturago/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-culturago_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev}
      - POSTGRES_DB=${POSTGRES_DB:-culturago}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - culturago

networks:
  culturago:
    driver: bridge

volumes:
  pg_data:
